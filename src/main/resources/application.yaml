spring:
  application:
    name: bar-manager
  datasource:
    url: jdbc:postgresql://localhost:5433/bardb
    username: kai
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

excel:
  template-path: src/main/resources/templates/일마감_템플릿.xlsx
  output-path: storage/excel/